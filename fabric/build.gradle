plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
}

def ensureDedicatedServerAcceptsEula = { runDir ->
    def dir = file(runDir)
    dir.mkdirs()
    def eula = new File(dir, 'eula.txt')
    if (!eula.exists()) {
        eula.text = 'eula=true\n'
    }
    def props = new File(dir, 'server.properties')
    if (!props.exists()) {
        props.text = 'online-mode=false\n'
    }
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
        serverSmoke {
            server()
            setConfigName('Fabric Server Smoke Test')
            ideConfigGenerated(false)
            runDir('runs/server-smoke')
            vmArg '-Dsimplylight.smokeTest=true'
        }
        serverRecipeVerify {
            server()
            setConfigName('Fabric Server Recipe Verification')
            ideConfigGenerated(false)
            runDir('runs/server-recipe-verify')
            vmArg '-Dsimplylight.recipeVerify=true'
        }
        clientCraftingScreenshots {
            client()
            setConfigName('Fabric Client Crafting Screenshots')
            ideConfigGenerated(false)
            runDir('runs/client-crafting-screenshots')
            vmArg '-Dsimplylight.craftingScreenshots=true'
            vmArg '-Dfabric-tag-conventions-v2.missingTagTranslationWarning=SILENCED'
        }
        clientLampPostScreenshots {
            client()
            setConfigName('Fabric Client Lamp Post Screenshots')
            ideConfigGenerated(false)
            runDir('runs/client-lamp-post-screenshots')
            vmArg '-Dsimplylight.lampPostScreenshots=true'
            vmArg '-Dfabric-tag-conventions-v2.missingTagTranslationWarning=SILENCED'
        }
        datagen {
            server()
            setConfigName('Fabric Datagen')
            ideConfigGenerated(true)
            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.modid=simplylight"
            vmArg "-Dfabric-api.datagen.output-dir=${file("src/main/generated")}"
            runDir('build/datagen')
        }
    }
}

afterEvaluate {
    tasks.matching { it.name in ['runServer', 'runServerSmoke', 'runServerRecipeVerify'] }.configureEach { task ->
        task.doFirst {
            if (task.name == 'runServerSmoke') {
                ensureDedicatedServerAcceptsEula('runs/server-smoke')
            } else if (task.name == 'runServerRecipeVerify') {
                ensureDedicatedServerAcceptsEula('runs/server-recipe-verify')
            } else {
                ensureDedicatedServerAcceptsEula('runs/server')
            }
        }
    }
}

sourceSets {
    main {
        resources {
            srcDirs += [
                    "src/main/generated"
            ]
        }
    }
}